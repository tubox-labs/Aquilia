# ============================================================================
# Aquilia — Async-native Python web framework
# ============================================================================
# Install core:           pip install aquilia
# Install with extras:    pip install aquilia[auth,redis,mail]
# Install everything:     pip install aquilia[all]
# ============================================================================

[build-system]
requires = ["scikit-build-core>=0.9", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

# ---------------------------------------------------------------------------
# Native extensions (aquilia/_core, aquilia/_dataengine, aquilia/_json) — all OPTIONAL
# ---------------------------------------------------------------------------
# All three are pure accelerators. aquilia/_core_loader.py,
# aquilia/_dataengine_loader.py, and aquilia/json.py fall back to pure Python
# when their extension is absent, so an install on a machine without a C++20
# compiler still produces a fully working package -- just without the native
# router/request context (_core), the native row/field plans (_dataengine), or
# the native codec (_json, which falls back to the standard library).
# See docs/engine/06-python-binding-architecture.md and docs/models-engine/03.
#
# cmake.source-dir is the repo root, whose CMakeLists.txt owns all three.
# Each still configures standalone (`cmake -S aquilia/_core`), which the
# sanitizer CI jobs depend on.
[tool.scikit-build]
cmake.source-dir = "."
cmake.build-type = "Release"
cmake.version = ">=3.21"
# Force Ninja so a compiler-free Windows install does not select NMake and then
# fail because nmake.exe is only shipped with Visual Studio Build Tools.
# scikit-build-core injects a compatible Ninja wheel when it is not installed.
cmake.args = ["-G", "Ninja"]
ninja.version = ">=1.11"
ninja.make-fallback = false
# When nanobind or a C++20 compiler is unavailable, skip the extensions instead
# of failing the whole install. Honoured by each extension's CMakeLists.txt.
cmake.define.AQUILIA_ENGINE_OPTIONAL = "ON"
wheel.packages = ["aquilia"]
sdist.include = [
    "CMakeLists.txt",
    "aquilia/_core/**/*.hpp",
    "aquilia/_core/**/*.cpp",
    "aquilia/_core/CMakeLists.txt",
    "aquilia/_dataengine/**/*.hpp",
    "aquilia/_dataengine/**/*.cpp",
    "aquilia/_dataengine/CMakeLists.txt",
    "aquilia/_json/**/*.hpp",
    "aquilia/_json/**/*.cpp",
    "aquilia/_json/**/*.h",
    "aquilia/_json/**/*.c",
    "aquilia/_json/CMakeLists.txt",
    # yyjson is vendored, so its source and licence must ship in the sdist for
    # the build to work offline and for the MIT terms to travel with the code.
    "aquilia/_json/vendor/yyjson/LICENSE",
]
sdist.exclude = [
    "**/build/**",
    "**/build-*/**",
    "**/.clangd",
    "**/.DS_Store",
    "**/__pycache__/**",
]

# Version stays sourced from aquilia/_version.py
metadata.version.provider = "scikit_build_core.metadata.regex"
metadata.version.input = "aquilia/_version.py"
# The `(?::\s*[^=]+)?` branch is required: the assignment is annotated
# (`__version__: str = "..."`), which a bare `__version__\s*=` pattern misses.
metadata.version.regex = '''(?m)^__version__\s*(?::\s*[^=]+)?=\s*["'](?P<value>[^"']+)["']'''

# ---------------------------------------------------------------------------
# cibuildwheel configuration for multi-platform binary wheel distribution
# (Linux x86_64/aarch64, macOS x86_64/arm64, Windows AMD64 across Py 3.10-3.14)
# ---------------------------------------------------------------------------
[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
skip = ["*-musllinux_*", "pp*", "*-win32", "*-manylinux_i686", "*_free_threaded", "*_nogil"]
build-verbosity = 1
test-requires = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "python-multipart>=0.0.9"]
test-command = '''python {project}/tools/check_installed_native.py && pytest {project}/tests/engine -o testpaths={project}/tests/engine -v -m "not slow"'''

[tool.cibuildwheel.environment]
# This must be a CMake definition. A plain AQUILIA_ENGINE_OPTIONAL environment
# variable does not override tool.scikit-build.cmake.define above and allowed
# CI to silently produce pure-Python wheels while native-only tests skipped.
CMAKE_ARGS = "-DAQUILIA_ENGINE_OPTIONAL=OFF"
CI = "1"
MACOSX_DEPLOYMENT_TARGET = "10.15"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]


# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name = "aquilia"
dynamic = ["version"]
description = "Async-native Python web framework with flow-first routing"
readme = "README.md"
authors = [
    { name = "Pawan Kumar", email = "aegis.invincible@gmail.com" },
]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
keywords = [
    "web", "framework", "async", "asgi", "http", "api",
    "routing", "middleware", "dependency-injection",
]

# ---------------------------------------------------------------------------
# Core dependencies — required by every install
# ---------------------------------------------------------------------------
dependencies = [
    "click>=8.1.0",
    "h11>=0.14.0",
    "jinja2>=3.1.0",
    "markupsafe>=2.1.0",
    # Elips is absent for the same reason: it is a C++ extension, only
    # aquilia.vectordb touches it, and every import of it is lazy. Install via
    # the "vectordb" extra below.
    "typing_extensions>=4.0.0; python_version < '3.11'",
    "watchfiles>=1.2.0",
]

# ---------------------------------------------------------------------------
# Optional dependency groups
# ---------------------------------------------------------------------------
[project.optional-dependencies]

# Template rendering engine — Jinja2 & MarkupSafe
template = [
    "jinja2>=3.1.0",
    "markupsafe>=2.1.0",
]

# Async SQLite compat shim — DEPRECATED: aiosqlite replaced by native aquilia.sqlite.
# Kept for gradual migration; will be removed in next major version.
sqlite-compat = ["aiosqlite>=0.20.0"]

# Auth subsystem — cryptography + password hashing
auth = [
    "cryptography>=42.0.0",
    "argon2-cffi>=23.1.0",
]

# Multipart form / file-upload parsing
multipart = [
    "python-multipart>=0.0.9",
]

# Redis cache & socket adapter backends
redis = [
    "redis[asyncio]>=5.0.0",
]

# SMTP email provider
mail = [
    "aiosmtplib>=3.0.0",
]

# AWS SES email provider
mail-ses = [
    "aiobotocore>=2.9.0",
]

# SendGrid email provider
mail-sendgrid = []

# DKIM signing for outbound mail (aquilia.mail.mime.sign_dkim)
mail-dkim = [
    "dkimpy>=1.1.0",
]

# Production server (Gunicorn + Uvicorn workers)
server = [
    "gunicorn>=22.0.0",
    "uvicorn[standard]>=0.30.0",
]

# Async PostgreSQL driver
postgres = [
    "asyncpg>=0.31.0",
]

# OpenTelemetry distributed tracing
otel = [
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
    "opentelemetry-instrumentation-asgi>=0.45b0",
]

# Embedded vector database — powers aquilia.vectordb.
# Kept out of core dependencies: elips is a C++ extension, only the vectordb
# subsystem touches it, and every import of it is lazy, so an install without
# this extra behaves exactly as before.
#
# The 3.11 marker is load-bearing: elips 1.1.0 publishes no cp310 wheels, and
# Aquilia supports 3.10. Without it, `aquilia[full]` becomes unresolvable on
# 3.10 rather than simply omitting vector support. On 3.10 the extra installs
# nothing and aquilia.vectordb degrades exactly as it does on any install
# without elips — VectorNotInstalledFault at first use.
vectordb = [
    "elips>=1.1.0; python_version >= '3.11'",
]


# ---- Convenience bundles ----------------------------------------------------

full = [
    "aquilia[auth,multipart,redis,mail,mail-ses,mail-sendgrid,mail-dkim,server,postgres,otel,template,vectordb]",
]

# Testing & development
testing = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "python-multipart>=0.0.9",
]

dev = [
    "aquilia[testing]",
    "ruff>=0.15.15",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

# ---------------------------------------------------------------------------
# URLs
# ---------------------------------------------------------------------------
[project.urls]
Homepage    = "https://github.com/tubox-labs/Aquilia"
Documentation = "https://github.com/tubox-labs/Aquilia#readme"
Repository  = "https://github.com/tubox-labs/Aquilia"
Issues      = "https://github.com/tubox-labs/Aquilia/issues"
Changelog   = "https://github.com/tubox-labs/Aquilia/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------
# Console scripts
# ---------------------------------------------------------------------------
[project.scripts]
aq = "aquilia.cli.__main__:main"

# ---------------------------------------------------------------------------
# Setuptools configuration
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["."]
include = ["aquilia*"]
exclude = ["tests*", "benchmark*", "docs*", "myapp*"]

[tool.setuptools.package-data]
"aquilia" = ["py.typed"]
"aquilia.admin" = ["templates/**/*.html"]

"aquilia.patterns" = ["README.md"]
"aquilia.templates" = ["README.md"]

[tool.setuptools.dynamic]
version = {attr = "aquilia._version.__version__"}

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (stress/performance) — deselect with '-m \"not slow\"'",
    "e2e: end-to-end tests that spawn a real dev-server subprocess",
]

[tool.coverage.run]
source = ["aquilia"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "env",
    "venv",
    "__pycache__",
    "*.egg-info",
    "dist",
    "node_modules",
    "aqdocx",
    "myapp",
    "benchmark",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module-level import not at top of file
    "E701",   # multiple statements on one line
    "E721",   # type comparison (use isinstance)
    "E741",   # ambiguous variable name
    "F403",   # star import used
    "F811",   # redefined unused name
    "F821",   # undefined name (often forward refs / dynamic)
    "F841",   # local variable assigned but never used
    "N801",   # class name should use CapWords
    "N802",   # function name should be lowercase
    "N805",   # first argument should be 'self'
    "N806",   # variable in function should be lowercase
    "N814",   # camelCase imported as constant
    "N817",   # camelCase imported as acronym
    "N818",   # exception name should end in Error
    "B004",   # unreliable callable check
    "B008",   # function call in argument defaults (Dep DI syntax)
    "B007",   # unused loop variable
    "B018",   # useless expression
    "B023",   # function uses loop variable
    "B027",   # empty method without abstract decorator
    "B904",   # raise without from inside except
    "B905",   # zip without strict parameter
    "SIM102", # collapsible if statements
    "SIM103", # needless bool
    "SIM105", # use contextlib.suppress
    "SIM108", # use ternary operator
    "SIM109", # compare with tuple
    "SIM110", # reimplemented builtin
    "SIM112", # uncapitalized env variables
    "SIM113", # enumerate for loop
    "SIM115", # open file with context handler
    "SIM116", # if-else instead of dict lookup
    "SIM118", # in dict keys
    "SIM201", # negate equal op
    "F402",   # import shadowed by loop variable
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports are intentional
".swarm/**/*.py" = ["N999"]  # dot-prefixed directory is valid for swarm system

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

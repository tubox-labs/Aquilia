<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" height="100%">
  <style>
    .bg { fill: #0b0f19; rx: 12px; }
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 500; fill: #94a3b8; }
    .axis-label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #94a3b8; }
    .bar-value { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 600; }
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4 4; }
    .axis-line { stroke: #334155; stroke-width: 1.5; }
  </style>
  <defs>
    <linearGradient id="grad-aquilia" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="grad-falcon" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <linearGradient id="grad-starlette" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="grad-litestar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="grad-sanic" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="grad-quart" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="grad-fastapi" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
    <linearGradient id="grad-django" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="grad-flask" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>
  <rect width="720" height="380" class="bg" />
  <text x="24" y="32" class="title">Scenario: `plaintext` (Plaintext) Throughput</text>
  <text x="24" y="50" class="subtitle">GET `/plaintext` returning 'Hello, World!' (Measures raw HTTP parsing and serialization throughput). — Higher is better (QPS)</text>
  <line x1="90" y1="325.0" x2="690" y2="325.0" class="grid-line" />
  <text x="80" y="329.0" text-anchor="end" class="axis-label">0 req/s</text>
  <line x1="90" y1="275.0" x2="690" y2="275.0" class="grid-line" />
  <text x="80" y="279.0" text-anchor="end" class="axis-label">17,759 req/s</text>
  <line x1="90" y1="225.0" x2="690" y2="225.0" class="grid-line" />
  <text x="80" y="229.0" text-anchor="end" class="axis-label">35,519 req/s</text>
  <line x1="90" y1="175.0" x2="690" y2="175.0" class="grid-line" />
  <text x="80" y="179.0" text-anchor="end" class="axis-label">53,278 req/s</text>
  <line x1="90" y1="125.0" x2="690" y2="125.0" class="grid-line" />
  <text x="80" y="129.0" text-anchor="end" class="axis-label">71,037 req/s</text>
  <line x1="90" y1="75.0" x2="690" y2="75.0" class="grid-line" />
  <text x="80" y="79.0" text-anchor="end" class="axis-label">88,797 req/s</text>
  <rect x="100.0" y="107.6" width="55.6" height="217.4" fill="url(#grad-falcon)" rx="4" />
  <text x="127.8" y="101.6" text-anchor="middle" fill="#a78bfa" class="bar-value">77,214</text>
  <text x="127.8" y="343" text-anchor="middle" class="axis-label" font-weight="600">Falcon</text>
  <rect x="165.6" y="127.3" width="55.6" height="197.7" fill="url(#grad-starlette)" rx="4" />
  <text x="193.3" y="121.3" text-anchor="middle" fill="#f472b6" class="bar-value">70,226</text>
  <text x="193.3" y="343" text-anchor="middle" class="axis-label" font-weight="600">Starlette</text>
  <rect x="231.1" y="191.4" width="55.6" height="133.6" fill="url(#grad-litestar)" rx="4" />
  <text x="258.9" y="185.4" text-anchor="middle" fill="#fbbf24" class="bar-value">47,447</text>
  <text x="258.9" y="343" text-anchor="middle" class="axis-label" font-weight="600">Litestar</text>
  <rect x="296.7" y="203.3" width="55.6" height="121.7" fill="url(#grad-aquilia)" rx="4" />
  <text x="324.4" y="197.3" text-anchor="middle" fill="#38bdf8" class="bar-value">43,243</text>
  <text x="324.4" y="343" text-anchor="middle" class="axis-label" font-weight="600">Aquilia</text>
  <rect x="362.2" y="215.6" width="55.6" height="109.4" fill="url(#grad-fastapi)" rx="4" />
  <text x="390.0" y="209.6" text-anchor="middle" fill="#6ee7b7" class="bar-value">38,856</text>
  <text x="390.0" y="343" text-anchor="middle" class="axis-label" font-weight="600">FastAPI</text>
  <rect x="427.8" y="215.9" width="55.6" height="109.1" fill="url(#grad-sanic)" rx="4" />
  <text x="455.6" y="209.9" text-anchor="middle" fill="#34d399" class="bar-value">38,753</text>
  <text x="455.6" y="343" text-anchor="middle" class="axis-label" font-weight="600">Sanic</text>
  <rect x="493.3" y="269.5" width="55.6" height="55.5" fill="url(#grad-quart)" rx="4" />
  <text x="521.1" y="263.5" text-anchor="middle" fill="#22d3ee" class="bar-value">19,698</text>
  <text x="521.1" y="343" text-anchor="middle" class="axis-label" font-weight="600">Quart</text>
  <rect x="558.9" y="313.2" width="55.6" height="11.8" fill="url(#grad-django)" rx="4" />
  <text x="586.7" y="307.2" text-anchor="middle" fill="#60a5fa" class="bar-value">4,192</text>
  <text x="586.7" y="343" text-anchor="middle" class="axis-label" font-weight="600">Django</text>
  <rect x="624.4" y="318.9" width="55.6" height="6.1" fill="url(#grad-flask)" rx="4" />
  <text x="652.2" y="312.9" text-anchor="middle" fill="#94a3b8" class="bar-value">2,183</text>
  <text x="652.2" y="343" text-anchor="middle" class="axis-label" font-weight="600">Flask</text>
  <line x1="90" y1="325" x2="690" y2="325" class="axis-line" />
</svg>
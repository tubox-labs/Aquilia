<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" height="100%">
  <style>
    .bg { fill: #090d16; rx: 16px; }
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 500; fill: #94a3b8; }
    .axis-label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #94a3b8; }
    .bar-value { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 600; }
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4 4; }
    .axis-line { stroke: #334155; stroke-width: 1.5; }
  </style>
  <defs>
    <linearGradient id="grad-aquilia" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="grad-falcon" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <linearGradient id="grad-starlette" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="grad-litestar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="grad-sanic" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="grad-quart" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="grad-fastapi" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
    <linearGradient id="grad-django" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="grad-flask" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>
  <rect width="720" height="380" class="bg" />
  <text x="24" y="34" class="title">Large 100KB Nested JSON Serialization (GET /json/large)</text>
  <text x="24" y="52" class="subtitle">Aquilia Rank #2 Top Tier - 23x faster than FastAPI (requests per second)</text>
  <line x1="90" y1="325.0" x2="690" y2="325.0" class="grid-line" />
  <text x="80" y="329.0" text-anchor="end" class="axis-label">0 req/s</text>
  <line x1="90" y1="275.0" x2="690" y2="275.0" class="grid-line" />
  <text x="80" y="279.0" text-anchor="end" class="axis-label">1,579 req/s</text>
  <line x1="90" y1="225.0" x2="690" y2="225.0" class="grid-line" />
  <text x="80" y="229.0" text-anchor="end" class="axis-label">3,158 req/s</text>
  <line x1="90" y1="175.0" x2="690" y2="175.0" class="grid-line" />
  <text x="80" y="179.0" text-anchor="end" class="axis-label">4,737 req/s</text>
  <line x1="90" y1="125.0" x2="690" y2="125.0" class="grid-line" />
  <text x="80" y="129.0" text-anchor="end" class="axis-label">6,316 req/s</text>
  <line x1="90" y1="75.0" x2="690" y2="75.0" class="grid-line" />
  <text x="80" y="79.0" text-anchor="end" class="axis-label">7,894 req/s</text>
  <rect x="100.0" y="107.6" width="55.6" height="217.4" fill="url(#grad-litestar)" rx="4" />
  <text x="127.8" y="101.6" text-anchor="middle" fill="#fbbf24" class="bar-value">6,865</text>
  <text x="127.8" y="343" text-anchor="middle" fill="#94a3b8" class="axis-label" font-weight="500">Litestar</text>
  <rect x="165.6" y="178.9" width="55.6" height="146.1" fill="url(#grad-aquilia)" rx="4" stroke="#38bdf8" stroke-width="2" />
  <text x="193.3" y="172.9" text-anchor="middle" fill="#38bdf8" class="bar-value">4,614</text>
  <text x="193.3" y="343" text-anchor="middle" fill="#38bdf8" class="axis-label" font-weight="700">Aquilia</text>
  <rect x="231.1" y="256.0" width="55.6" height="69.0" fill="url(#grad-sanic)" rx="4" />
  <text x="258.9" y="250.0" text-anchor="middle" fill="#34d399" class="bar-value">2,179</text>
  <text x="258.9" y="343" text-anchor="middle" fill="#94a3b8" class="axis-label" font-weight="500">Sanic</text>
  <rect x="296.7" y="273.9" width="55.6" height="51.1" fill="url(#grad-falcon)" rx="4" />
  <text x="324.4" y="267.9" text-anchor="middle" fill="#a78bfa" class="bar-value">1,613</text>
  <text x="324.4" y="343" text-anchor="middle" fill="#94a3b8" class="axis-label" font-weight="500">Falcon</text>
  <rect x="362.2" y="274.0" width="55.6" height="51.0" fill="url(#grad-starlette)" rx="4" />
  <text x="390.0" y="268.0" text-anchor="middle" fill="#f472b6" class="bar-value">1,609</text>
  <text x="390.0" y="343" text-anchor="middle" fill="#94a3b8" class="axis-label" font-weight="500">Starlette</text>
  <rect x="427.8" y="285.5" width="55.6" height="39.5" fill="url(#grad-quart)" rx="4" />
  <text x="455.6" y="279.5" text-anchor="middle" fill="#22d3ee" class="bar-value">1,247</text>
  <text x="455.6" y="343" text-anchor="middle" fill="#94a3b8" class="axis-label" font-weight="500">Quart</text>
  <rect x="493.3" y="287.0" width="55.6" height="38.0" fill="url(#grad-django)" rx="4" />
  <text x="521.1" y="281.0" text-anchor="middle" fill="#60a5fa" class="bar-value">1,201</text>
  <text x="521.1" y="343" text-anchor="middle" fill="#94a3b8" class="axis-label" font-weight="500">Django</text>
  <rect x="558.9" y="293.0" width="55.6" height="32.0" fill="url(#grad-flask)" rx="4" />
  <text x="586.7" y="287.0" text-anchor="middle" fill="#94a3b8" class="bar-value">1,009</text>
  <text x="586.7" y="343" text-anchor="middle" fill="#94a3b8" class="axis-label" font-weight="500">Flask</text>
  <rect x="624.4" y="318.6" width="55.6" height="6.4" fill="url(#grad-fastapi)" rx="4" />
  <text x="652.2" y="312.6" text-anchor="middle" fill="#6ee7b7" class="bar-value">201</text>
  <text x="652.2" y="343" text-anchor="middle" fill="#94a3b8" class="axis-label" font-weight="500">FastAPI</text>
  <line x1="90" y1="325" x2="690" y2="325" class="axis-line" />
</svg>
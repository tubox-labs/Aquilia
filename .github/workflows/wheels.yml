# =============================================================================
# Aquilia — Multi-Platform Native Wheel Builder
# =============================================================================
# Builds binary wheels for Linux (x86_64, aarch64), macOS (Intel, Apple Silicon),
# and Windows (AMD64) across Python 3.10 – 3.13 using cibuildwheel.
# =============================================================================

name: "Wheels"

on:
  push:
    branches: [master, main, develop]
    paths:
      - "aquilia/_core/**"
      - "aquilia/_dataengine/**"
      - "aquilia/_json/**"
      - "CMakeLists.txt"
      - "pyproject.toml"
      - ".github/workflows/wheels.yml"
  pull_request:
    branches: [master, main, develop]
    paths:
      - "aquilia/_core/**"
      - "aquilia/_dataengine/**"
      - "aquilia/_json/**"
      - "CMakeLists.txt"
      - "pyproject.toml"
      - ".github/workflows/wheels.yml"
  workflow_dispatch:

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_wheels:
    name: "📦 Build wheels (${{ matrix.os }} / ${{ matrix.arch }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-latest
            arch: aarch64
          - os: macos-13
            arch: x86_64
          - os: macos-14
            arch: arm64
          - os: windows-latest
            arch: AMD64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for Linux aarch64)
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: "📦 Build sdist"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist
        run: python -m build --sdist

      - name: Verify sdist
        run: twine check dist/*

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

# =============================================================================
# Aquilia — Multi-Platform Native Wheel Builder
# =============================================================================
# Builds binary wheels for Linux (x86_64, aarch64), macOS (Intel, Apple Silicon),
# and Windows (AMD64) across Python 3.10 – 3.14 using cibuildwheel.
# =============================================================================

name: "Wheels"

on:
  push:
    branches: [master, main, develop]
    paths:
      - "aquilia/_core/**"
      - "aquilia/_dataengine/**"
      - "aquilia/_json/**"
      - "CMakeLists.txt"
      - "pyproject.toml"
      - ".github/workflows/wheels.yml"
  pull_request:
    branches: [master, main, develop]
    paths:
      - "aquilia/_core/**"
      - "aquilia/_dataengine/**"
      - "aquilia/_json/**"
      - "CMakeLists.txt"
      - "pyproject.toml"
      - ".github/workflows/wheels.yml"
  workflow_dispatch:

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_wheels:
    name: "📦 Build wheels (${{ matrix.os }} / ${{ matrix.arch }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-latest
            arch: aarch64
          - os: macos-14
            arch: x86_64
          - os: macos-14
            arch: arm64
          # Build redistributable wheels with stable MSVC v143, not the VS
          # 2026 preview toolchain currently selected by windows-latest.
          - os: windows-2022
            arch: AMD64

    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false

      - name: Set up QEMU (for Linux aarch64)
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0

      - name: Build wheels
        uses: pypa/cibuildwheel@8d2b08b68458a16aeb24b64e68a09ab1c8e82084 # v3.4.1
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          MACOSX_DEPLOYMENT_TARGET: "10.15"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: "📦 Build sdist"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist
        run: python -m build --sdist

      - name: Verify sdist
        run: twine check dist/*

      - name: Upload sdist artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  windows_sdist_fallback:
    name: "Windows 3.14 compiler-free sdist install"
    needs: build_sdist
    runs-on: windows-latest
    steps:
      - name: Set up Python 3.14
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.14"

      - name: Download sdist
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: cibw-sdist
          path: dist

      - name: Install without a C/C++ compiler
        shell: pwsh
        run: |
          $env:CMAKE_GENERATOR = "Ninja"
          $env:CC = "C:\missing-aquilia-toolchain\cl.exe"
          $env:CXX = "C:\missing-aquilia-toolchain\cl.exe"
          $sdist = Get-ChildItem "dist\*.tar.gz" | Select-Object -First 1
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir $sdist.FullName

      - name: Verify pure-Python fallbacks
        shell: pwsh
        run: |
          Set-Location $env:RUNNER_TEMP
          python -c "import aquilia; from aquilia._core_loader import NATIVE; from aquilia._dataengine_loader import DATAENGINE_NATIVE; from aquilia.json import native as JSON_NATIVE; assert not NATIVE and not DATAENGINE_NATIVE and not JSON_NATIVE, (NATIVE, DATAENGINE_NATIVE, JSON_NATIVE); print('compiler-free Windows install verified', aquilia.__version__)"

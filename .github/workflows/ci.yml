# =============================================================================
# Aquilia — Continuous Integration
# =============================================================================
# Runs on every push to master and on pull requests.
# Provides fast feedback on code quality and test correctness.
# =============================================================================

name: "CI"

on:
  push:
    branches: [master, main, develop]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "assets/**"
      - "aqdocx/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  pull_request:
    branches: [master, main, develop]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "assets/**"
      - "aqdocx/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    name: "🔍 Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          pip install --upgrade pip
          pip install ruff
      - name: Ruff check
        run: ruff check aquilia/ --output-format=github
      - name: Ruff format
        run: ruff format --check aquilia/

  test:
    name: "🧪 py${{ matrix.python }} / ${{ matrix.os }}"
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"
          - os: windows-latest
            python: "3.12"
            install_mode: "pypi-sim"
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install (editable)
        if: matrix.install_mode != 'pypi-sim'
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e ".[testing]"
          pip install -r requirements-dev.txt
      - name: Install (pypi-sim — clean end-user install)
        if: matrix.install_mode == 'pypi-sim'
        run: |
          pip install --upgrade pip setuptools wheel
          pip install aquilia[testing]
          pip install -r requirements-dev.txt
      - name: Test
        run: pytest tests/ -v --tb=short -q

  windows-sdist-install:
    name: "Windows 3.14 compiler-free sdist install"
    needs: lint
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.14"
      - name: Build sdist
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist
      - name: Install with no compiler available
        shell: pwsh
        run: |
          $env:CC = "C:\missing-aquilia-toolchain\cl.exe"
          $env:CXX = "C:\missing-aquilia-toolchain\cl.exe"
          $sdist = Get-ChildItem "dist\*.tar.gz" | Select-Object -First 1
          python -m pip install --no-cache-dir $sdist.FullName
      - name: Verify installed fallback package
        shell: pwsh
        run: |
          Set-Location $env:RUNNER_TEMP
          python -c "import aquilia; from aquilia._core_loader import NATIVE; from aquilia._dataengine_loader import DATAENGINE_NATIVE; from aquilia.json import native as JSON_NATIVE; assert not NATIVE and not DATAENGINE_NATIVE and not JSON_NATIVE, (NATIVE, DATAENGINE_NATIVE, JSON_NATIVE); print('compiler-free Windows install verified', aquilia.__version__)"

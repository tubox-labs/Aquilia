<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" height="100%">
  <style>
    .bg { fill: #0b0f19; rx: 12px; }
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 500; fill: #94a3b8; }
    .axis-label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #94a3b8; }
    .bar-value { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 600; }
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4 4; }
    .axis-line { stroke: #334155; stroke-width: 1.5; }
  </style>
  <defs>
    <linearGradient id="grad-aquilia" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="grad-falcon" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <linearGradient id="grad-starlette" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="grad-litestar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="grad-sanic" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="grad-quart" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="grad-fastapi" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
    <linearGradient id="grad-django" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="grad-flask" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>
  <rect width="720" height="380" class="bg" />
  <text x="24" y="32" class="title">Scenario: `json` (Json) Throughput</text>
  <text x="24" y="50" class="subtitle">GET `/json` returning a small JSON dictionary. (Measures JSON encoding overhead). — Higher is better (QPS)</text>
  <line x1="90" y1="325.0" x2="690" y2="325.0" class="grid-line" />
  <text x="80" y="329.0" text-anchor="end" class="axis-label">0 req/s</text>
  <line x1="90" y1="275.0" x2="690" y2="275.0" class="grid-line" />
  <text x="80" y="279.0" text-anchor="end" class="axis-label">15,320 req/s</text>
  <line x1="90" y1="225.0" x2="690" y2="225.0" class="grid-line" />
  <text x="80" y="229.0" text-anchor="end" class="axis-label">30,640 req/s</text>
  <line x1="90" y1="175.0" x2="690" y2="175.0" class="grid-line" />
  <text x="80" y="179.0" text-anchor="end" class="axis-label">45,961 req/s</text>
  <line x1="90" y1="125.0" x2="690" y2="125.0" class="grid-line" />
  <text x="80" y="129.0" text-anchor="end" class="axis-label">61,281 req/s</text>
  <line x1="90" y1="75.0" x2="690" y2="75.0" class="grid-line" />
  <text x="80" y="79.0" text-anchor="end" class="axis-label">76,601 req/s</text>
  <rect x="100.0" y="107.6" width="55.6" height="217.4" fill="url(#grad-falcon)" rx="4" />
  <text x="127.8" y="101.6" text-anchor="middle" fill="#a78bfa" class="bar-value">66,610</text>
  <text x="127.8" y="343" text-anchor="middle" class="axis-label" font-weight="600">Falcon</text>
  <rect x="165.6" y="120.7" width="55.6" height="204.3" fill="url(#grad-starlette)" rx="4" />
  <text x="193.3" y="114.7" text-anchor="middle" fill="#f472b6" class="bar-value">62,609</text>
  <text x="193.3" y="343" text-anchor="middle" class="axis-label" font-weight="600">Starlette</text>
  <rect x="231.1" y="172.7" width="55.6" height="152.3" fill="url(#grad-litestar)" rx="4" />
  <text x="258.9" y="166.7" text-anchor="middle" fill="#fbbf24" class="bar-value">46,667</text>
  <text x="258.9" y="343" text-anchor="middle" class="axis-label" font-weight="600">Litestar</text>
  <rect x="296.7" y="184.7" width="55.6" height="140.3" fill="url(#grad-aquilia)" rx="4" />
  <text x="324.4" y="178.7" text-anchor="middle" fill="#38bdf8" class="bar-value">42,993</text>
  <text x="324.4" y="343" text-anchor="middle" class="axis-label" font-weight="600">Aquilia</text>
  <rect x="362.2" y="200.3" width="55.6" height="124.7" fill="url(#grad-sanic)" rx="4" />
  <text x="390.0" y="194.3" text-anchor="middle" fill="#34d399" class="bar-value">38,219</text>
  <text x="390.0" y="343" text-anchor="middle" class="axis-label" font-weight="600">Sanic</text>
  <rect x="427.8" y="212.1" width="55.6" height="112.9" fill="url(#grad-fastapi)" rx="4" />
  <text x="455.6" y="206.1" text-anchor="middle" fill="#6ee7b7" class="bar-value">34,587</text>
  <text x="455.6" y="343" text-anchor="middle" class="axis-label" font-weight="600">FastAPI</text>
  <rect x="493.3" y="264.8" width="55.6" height="60.2" fill="url(#grad-quart)" rx="4" />
  <text x="521.1" y="258.8" text-anchor="middle" fill="#22d3ee" class="bar-value">18,447</text>
  <text x="521.1" y="343" text-anchor="middle" class="axis-label" font-weight="600">Quart</text>
  <rect x="558.9" y="311.4" width="55.6" height="13.6" fill="url(#grad-django)" rx="4" />
  <text x="586.7" y="305.4" text-anchor="middle" fill="#60a5fa" class="bar-value">4,172</text>
  <text x="586.7" y="343" text-anchor="middle" class="axis-label" font-weight="600">Django</text>
  <rect x="624.4" y="316.2" width="55.6" height="8.8" fill="url(#grad-flask)" rx="4" />
  <text x="652.2" y="310.2" text-anchor="middle" fill="#94a3b8" class="bar-value">2,698</text>
  <text x="652.2" y="343" text-anchor="middle" class="axis-label" font-weight="600">Flask</text>
  <line x1="90" y1="325" x2="690" y2="325" class="axis-line" />
</svg>
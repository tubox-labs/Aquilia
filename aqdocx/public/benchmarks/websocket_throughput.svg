  <text x="127.8" y="343" text-anchor="middle" fill="#94a3b8" class="axis-label" font-weight="500">Sanic</text>
  <rect x="165.6" y="117.3" width="55.6" height="207.7" fill="url(#grad-aquilia)" rx="4" stroke="#38bdf8" stroke-width="2" />
  <text x="193.3" y="111.3" text-anchor="middle" fill="#38bdf8" class="bar-value">17,388</text>
  <text x="193.3" y="343" text-anchor="middle" fill="#38bdf8" class="axis-label" font-weight="700">Aquilia</text>
  <rect x="231.1" y="127.9" width="55.6" height="197.1" fill="url(#grad-starlette)" rx="4" />
  <text x="258.9" y="121.9" text-anchor="middle" fill="#f472b6" class="bar-value">16,500</text>
  <text x="258.9" y="343" text-anchor="middle" fill="#94a3b8" class="axis-label" font-weight="500">Starlette</text>
  <rect x="296.7" y="141.9" width="55.6" height="183.1" fill="url(#grad-fastapi)" rx="4" />
  <text x="324.4" y="135.9" text-anchor="middle" fill="#6ee7b7" class="bar-value">15,327</text>
  <text x="324.4" y="343" text-anchor="middle" fill="#94a3b8" class="axis-label" font-weight="500">FastAPI</text>
  <rect x="362.2" y="148.2" width="55.6" height="176.8" fill="url(#grad-litestar)" rx="4" />
  <text x="390.0" y="142.2" text-anchor="middle" fill="#fbbf24" class="bar-value">14,800</text>
  <text x="390.0" y="343" text-anchor="middle" fill="#94a3b8" class="axis-label" font-weight="500">Litestar</text>
  <rect x="427.8" y="176.9" width="55.6" height="148.1" fill="url(#grad-quart)" rx="4" />
  <text x="455.6" y="170.9" text-anchor="middle" fill="#22d3ee" class="bar-value">12,400</text>
  <text x="455.6" y="343" text-anchor="middle" fill="#94a3b8" class="axis-label" font-weight="500">Quart</text>
  <rect x="493.3" y="323.0" width="55.6" height="2.0" fill="url(#grad-falcon)" rx="4" />
  <text x="521.1" y="317.0" text-anchor="middle" fill="#a78bfa" class="bar-value">0 / Fail</text>
  <text x="521.1" y="343" text-anchor="middle" fill="#94a3b8" class="axis-label" font-weight="500">Falcon</text>
  <rect x="558.9" y="323.0" width="55.6" height="2.0" fill="url(#grad-flask)" rx="4" />
  <text x="586.7" y="317.0" text-anchor="middle" fill="#94a3b8" class="bar-value">0 / Fail</text>
  <text x="586.7" y="343" text-anchor="middle" fill="#94a3b8" class="axis-label" font-weight="500">Flask</text>
  <rect x="624.4" y="323.0" width="55.6" height="2.0" fill="url(#grad-django)" rx="4" />
  <text x="652.2" y="317.0" text-anchor="middle" fill="#60a5fa" class="bar-value">0 / Fail</text>
  <text x="652.2" y="343" text-anchor="middle" fill="#94a3b8" class="axis-label" font-weight="500">Django</text>
  <line x1="90" y1="325" x2="690" y2="325" class="axis-line" />
</svg>
  <rect width="720" height="380" class="bg" />
  <text x="24" y="34" class="title">Mean Throughput Across All Workload Scenarios</text>
  <text x="24" y="52" class="subtitle">Aquilia Top Tier - 27,206 req/s mean throughput across core endpoints</text>
  <line x1="90" y1="325.0" x2="690" y2="325.0" class="grid-line" />
  <text x="80" y="329.0" text-anchor="end" class="axis-label">0 r/s</text>
  <line x1="90" y1="275.0" x2="690" y2="275.0" class="grid-line" />
  <text x="80" y="279.0" text-anchor="end" class="axis-label">9,539 r/s</text>
  <line x1="90" y1="225.0" x2="690" y2="225.0" class="grid-line" />
  <text x="80" y="229.0" text-anchor="end" class="axis-label">19,078 r/s</text>
  <line x1="90" y1="175.0" x2="690" y2="175.0" class="grid-line" />
  <text x="80" y="179.0" text-anchor="end" class="axis-label">28,618 r/s</text>
  <line x1="90" y1="125.0" x2="690" y2="125.0" class="grid-line" />
  <text x="80" y="129.0" text-anchor="end" class="axis-label">38,157 r/s</text>
  <line x1="90" y1="75.0" x2="690" y2="75.0" class="grid-line" />
  <text x="80" y="79.0" text-anchor="end" class="axis-label">47,696 r/s</text>
  <rect x="100.0" y="107.6" width="55.6" height="217.4" fill="url(#grad-falcon)" rx="4" />
  <text x="127.8" y="101.6" text-anchor="middle" fill="#a78bfa" class="bar-value">41,475</text>
  <text x="127.8" y="343" text-anchor="middle" fill="#94a3b8" class="axis-label" font-weight="500">Falcon</text>
  <rect x="165.6" y="130.8" width="55.6" height="194.2" fill="url(#grad-starlette)" rx="4" />
  <text x="193.3" y="124.8" text-anchor="middle" fill="#f472b6" class="bar-value">37,058</text>
  <text x="193.3" y="343" text-anchor="middle" fill="#94a3b8" class="axis-label" font-weight="500">Starlette</text>
  <rect x="231.1" y="182.0" width="55.6" height="143.0" fill="url(#grad-litestar)" rx="4" />
  <text x="258.9" y="176.0" text-anchor="middle" fill="#fbbf24" class="bar-value">27,288</text>
  <text x="258.9" y="343" text-anchor="middle" fill="#94a3b8" class="axis-label" font-weight="500">Litestar</text>
  <rect x="296.7" y="182.4" width="55.6" height="142.6" fill="url(#grad-aquilia)" rx="4" stroke="#38bdf8" stroke-width="2" />
  <text x="324.4" y="176.4" text-anchor="middle" fill="#38bdf8" class="bar-value">27,206</text>
  <text x="324.4" y="343" text-anchor="middle" fill="#38bdf8" class="axis-label" font-weight="700">Aquilia</text>
  <rect x="362.2" y="203.1" width="55.6" height="121.9" fill="url(#grad-sanic)" rx="4" />
  <text x="390.0" y="197.1" text-anchor="middle" fill="#34d399" class="bar-value">23,265</text>
  <text x="390.0" y="343" text-anchor="middle" fill="#94a3b8" class="axis-label" font-weight="500">Sanic</text>
  <rect x="427.8" y="261.8" width="55.6" height="63.2" fill="url(#grad-quart)" rx="4" />
  <text x="455.6" y="255.8" text-anchor="middle" fill="#22d3ee" class="bar-value">12,064</text>
  <text x="455.6" y="343" text-anchor="middle" fill="#94a3b8" class="axis-label" font-weight="500">Quart</text>
  <rect x="493.3" y="264.7" width="55.6" height="60.3" fill="url(#grad-fastapi)" rx="4" />
  <text x="521.1" y="258.7" text-anchor="middle" fill="#6ee7b7" class="bar-value">11,495</text>
  <text x="521.1" y="343" text-anchor="middle" fill="#94a3b8" class="axis-label" font-weight="500">FastAPI</text>
  <rect x="558.9" y="309.7" width="55.6" height="15.3" fill="url(#grad-django)" rx="4" />
  <text x="586.7" y="303.7" text-anchor="middle" fill="#60a5fa" class="bar-value">2,912</text>
  <text x="586.7" y="343" text-anchor="middle" fill="#94a3b8" class="axis-label" font-weight="500">Django</text>
  <rect x="624.4" y="312.4" width="55.6" height="12.6" fill="url(#grad-flask)" rx="4" />
  <text x="652.2" y="306.4" text-anchor="middle" fill="#94a3b8" class="bar-value">2,403</text>
  <text x="652.2" y="343" text-anchor="middle" fill="#94a3b8" class="axis-label" font-weight="500">Flask</text>
  <line x1="90" y1="325" x2="690" y2="325" class="axis-line" />
</svg>